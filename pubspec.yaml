name: book_reader
description: 跨平台电子书阅读器 (Android/Linux/Windows 优先)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  dynamic_color: ^1.7.0
  shared_preferences: ^2.3.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  archive: ^4.0.0
  path: ^1.9.0
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  charset: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
