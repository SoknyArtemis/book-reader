name: book_reader
description: 跨平台电子书阅读器（EPUB / TXT），Material You + Material 3 风格。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dynamic_color: ^1.7.0
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  archive: ^3.6.1
  xml: ^6.5.0
  shared_preferences: ^2.2.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
